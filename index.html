        <div class="swiper bannerSwiper mt-[90px] h-[90vh]">
          <div class="swiper-wrapper">
            <div class="swiper-slide">
              <img class="w-full h-full object-cover" src="./assets/photos/appliance repair services.webp" alt="" />
            </div>
            <div class="swiper-slide">
              <img class="w-full h-full object-cover" src="./assets/photos/slide-2-2.jpg" alt="" />

          </div>

          <div class="banner-content">
            <h1 class="banner-content-title">
              №1 məişət texnikası<br />
              təmiri xidməti

            <ul class="banner-content-tabs">

              <li>Servis</li>
              <li>Baxım</li>
              <li>Ehtiyat hissələri</li>
              <li>Sifariş</li>
            </ul>

            <div class="banner-content-search">
              <input type="text" placeholder="Axtarış edin..." />
              <button type="button">
                Axtar
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
